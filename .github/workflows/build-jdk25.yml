name: CI

on:
  push:
    branches: ["26.1.x"]
  pull_request:
    branches: ["26.1.x"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Resolve dependencies
        run: mvn dependency:go-offline -B

      - name: Run tests
        run: mvn test -B

      - name: Package
        run: mvn package -DskipTests -B
